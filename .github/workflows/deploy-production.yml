name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue deploys instead of cancelling one that is already shipping.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_CLI: "65.4.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deployment-config:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.secrets.outputs.available }}
    steps:
      - id: secrets
        env:
          AVAILABLE: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: printf 'available=%s\n' "$AVAILABLE" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: [check, deployment-config]
    if: needs.deployment-config.outputs.available == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm i -g vercel@${{ env.VERCEL_CLI }}
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
